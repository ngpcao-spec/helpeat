project_id = "helpeat-auth-validation"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:54321"

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/helpeat_isolated_auth_claims"
